<dialog id="edit-modal" open>
  <article style="max-width: 600px; width: 100%;">
    <header>
      <a href="#close" aria-label="Close" class="close" onclick="document.getElementById('modal-container').innerHTML = ''; return false;"></a>
      Edit Ride #{{ ride.id }}
    </header>
    <form id="edit-ride-form" hx-post="/rides/{{ ride.id }}/edit" hx-target="#history-container" hx-swap="innerHTML">
      <div class="input-container">
        <div class="input-label-row">
          <label for="edit-start-time">Start Time (Local)</label>
          <span id="edit-start-time-badge" class="change-badge">Modified</span>
        </div>
        <input type="datetime-local" id="edit-start-time" name="start_time" value="{{ start_time_local }}" required>
      </div>

      <div class="input-container">
        <div class="input-label-row">
          <label for="edit-end-time">End Time (Local)</label>
          <span id="edit-end-time-badge" class="change-badge">Modified</span>
        </div>
        <input type="datetime-local" id="edit-end-time" name="end_time" value="{{ end_time_local }}" required>
      </div>

      <div class="input-container">
        <div class="input-label-row">
          <label for="edit-route">Route</label>
          <span id="edit-route-badge" class="change-badge">Modified</span>
        </div>
        <select id="edit-route" name="route" required>
          <option value="A" {% if ride.route == 'A' %}selected{% endif %}>A</option>
          <option value="B" {% if ride.route == 'B' %}selected{% endif %}>B</option>
          <option value="C" {% if ride.route == 'C' %}selected{% endif %}>C</option>
        </select>
      </div>

      <div class="input-container">
        <div class="input-label-row">
          <label for="edit-direction">Direction</label>
          <span id="edit-direction-badge" class="change-badge">Modified</span>
        </div>
        <select id="edit-direction" name="direction" required>
          <option value="work" {% if ride.direction == 'work' %}selected{% endif %}>To Work</option>
          <option value="home" {% if ride.direction == 'home' %}selected{% endif %}>Home</option>
        </select>
      </div>

      <div class="input-container">
        <label style="display: flex; align-items: center; justify-content: space-between;">
          <span>
            <input type="checkbox" id="edit-extra-dist" name="extra_dist" value="1" {% if ride.extra_dist %}checked{% endif %}>
            Alternate Start (+ Extra Distance)
          </span>
          <span id="edit-extra-dist-badge" class="change-badge">Modified</span>
        </label>
      </div>

      <div class="grid" style="margin-top: 1.5rem;">
        <button type="button" class="contrast"
                hx-delete="/rides/{{ ride.id }}/delete"
                hx-target="#history-container"
                hx-swap="innerHTML"
                hx-confirm="Are you sure you want to delete this ride permanently?">
          Delete
        </button>
        <button type="button" class="secondary outline" onclick="document.getElementById('modal-container').innerHTML = '';">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>

    <script>
      (function() {
        const form = document.getElementById('edit-ride-form');
        if (!form) return;

        const fields = [
          { id: 'edit-start-time', type: 'value', initial: null },
          { id: 'edit-end-time', type: 'value', initial: null },
          { id: 'edit-route', type: 'value', initial: null },
          { id: 'edit-direction', type: 'value', initial: null },
          { id: 'edit-extra-dist', type: 'checked', initial: null }
        ];

        // Cache initial values
        fields.forEach(field => {
          const el = document.getElementById(field.id);
          if (el) {
            field.initial = (field.type === 'checked') ? el.checked : el.value;
          }
        });

        function checkChanges() {
          fields.forEach(field => {
            const el = document.getElementById(field.id);
            if (!el) return;

            const current = (field.type === 'checked') ? el.checked : el.value;
            const modified = current !== field.initial;

            const badge = document.getElementById(field.id + '-badge');
            if (modified) {
              el.classList.add('is-modified');
              if (badge) badge.style.display = 'inline-block';
            } else {
              el.classList.remove('is-modified');
              if (badge) badge.style.display = 'none';
            }
          });
        }

        form.addEventListener('input', checkChanges);
        form.addEventListener('change', checkChanges);
      })();
    </script>
  </article>
</dialog>

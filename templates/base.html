<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bike Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <style>
        .data-small { font-size: 0.8rem; color: var(--muted-color); }
        {% block extra_style %}{% endblock %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="container">
    <nav>
        <ul>
            <li><strong>🚲 Tracker</strong></li>
        </ul>
        {% if request.session.get('logged_in') %}
        <ul>
            <li><a href="/" class="{% if active_page == 'tracker' %}contrast{% else %}secondary{% endif %}">Tracker</a></li>
            <li><a href="/dashboard" class="{% if active_page == 'dashboard' %}contrast{% else %}secondary{% endif %}">Dashboard</a></li>
        </ul>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
